autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2

gateway:
  enabled: true
  hostnames:
    - login.zoom.uw.edu
  maxRequestSize: 256Ki

repo: zoom-login-statics
instance: prod
namespace:
  enabled: true

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 25m
    memory: 128Mi

service:
  enabled: true
  ports:
    - port: 80
      targetPort: 8000
      name: http
    - port: 9113
      targetPort: 9113
      name: metrics

deploymentInitialization:
  enabled: false

daemon:
  enabled: false

database:
  engine: null

externalService:
  enabled: false

cronjob:
  enabled: false

memcached:
  enabled: false

certs:
  mounted: false

gcsCredentials:
  mounted: false

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    port: metrics

readiness:
  enabled: false

lifecycle:
  enabled: true

environmentVariables:
  - name: "ENV"
    value: "prod"
